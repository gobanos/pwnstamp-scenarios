# Node scenario, as a one-service Compose project.
# Image pinned to the linux/amd64 platform manifest of node:24.22.2-trixie-slim.
# https://hub.docker.com/layers/library/node/trixie-slim/images/sha256-6f3406bb40734a2cbe3c78c3a5d9a467113b41b7a4c653a8d0534a276c67afdf
services:
  app:
    image: node@sha256:6f3406bb40734a2cbe3c78c3a5d9a467113b41b7a4c653a8d0534a276c67afdf
    command: ["node", "server.js"]
    user: "1000"
    working_dir: /app
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - type: bind
        source: ./app
        target: /app
        read_only: true
    expose: ["3000"]
    # Local trial only: the platform reaches the port through the proxy, never a host port.
    ports: ["127.0.0.1:${HOST_PORT:-3000}:3000"]
